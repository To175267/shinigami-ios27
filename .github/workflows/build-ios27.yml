# .github/workflows/build-ios27.yml
#
# Builds iOS 27 SSH ramdisks for the A13 Bionic generation WITHOUT a Mac,
# using a GitHub Actions macOS runner.
# Based on Rust505/iOS-ramdisk-builder-A12-A13.
#
# A13 Bionic = iPhone 11 (iPhone12,1) | 11 Pro (iPhone12,3) | 11 Pro Max (iPhone12,5) | SE2 (iPhone12,8)
# A12 (XR/XS/XS Max) has NO iOS 27 - Apple did not release it for that chip.
#
# Usage:
#   1) This file lives at  .github/workflows/build-ios27.yml  in the repo
#   2) GitHub -> "Actions" tab -> "Build iOS 27 Ramdisks" -> "Run workflow"
#   3) Pick the version (default 27.0.1) and run. Download the artifact when done.
#
# Notes:
#   - The BUILD does not need the iPhone: it downloads the IPSW and patches it.
#     The device is only used to BOOT the ramdisk (boot.sh, local, with Pwned DFU).
#   - macOS runners: free on PUBLIC repos. On private ones they consume minutes x10.
#   - macos-13 was RETIRED on 2025-12-04: jobs requesting it stay QUEUED FOREVER
#     (no failure email). macos-15-intel is the official x86_64 replacement.
#
# Runner quirks this workflow works around:
#   1) build4.sh uses `declare -A` (bash 4+), but macOS ships /bin/bash 3.2 ->
#      install a modern bash and put it first on PATH.
#   2) Homebrew 6 refuses formulas/casks from an untrusted tap -> `brew trust`.
#   3) The upstream repo ships resources/ssh.tar.gz but not the sshtarlist.txt
#      that setup.sh demands -> derive it from the tarball.

name: Build iOS Ramdisks

on:
  workflow_dispatch:
    inputs:
      version:
        description: "iOS version (e.g. 27.0.1, 26.6, 18.3)"
        required: true
        default: "27.0.1"

jobs:
  build:
    runs-on: macos-15-intel    # x86_64 (the builder binaries are Intel).
                               # macos-13 is retired -> jobs would queue forever.
    strategy:
      fail-fast: false
      matrix:
        # A13 devices with iOS 27 (remove the ones you do not want)
        device: ["iPhone12,1", "iPhone12,3", "iPhone12,5", "iPhone12,8"]
    name: build ${{ matrix.device }} iOS ${{ inputs.version }}
    steps:
      - name: Disk space (before)
        run: df -h /

      - name: Clone the builder
        run: git clone --depth 1 https://github.com/Rust505/iOS-ramdisk-builder-A12-A13.git builder

      - name: Permissions
        run: |
          chmod +x builder/*.sh builder/scripts/*.sh
          # The upstream repo committed EVERY vendored binary with mode 100644 (no
          # exec bit), so the `[[ -x "$IRECOVERY" ]]` style checks inside the scripts
          # abort with "missing: .../tools/darwin/irecovery". Note setup.sh only tests
          # `-e` (exists), which is why it reported them as OK.
          chmod +x builder/tools/darwin/* builder/bin/* 2>/dev/null || true

      - name: Setup (bash4 + ipsw + pyimg4/capstone)
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          cd builder
          # (2) Homebrew 6 will not load blacktop/tap without an explicit trust.
          brew trust blacktop/tap || true
          brew tap blacktop/tap || true
          brew install blacktop/tap/ipsw || true
          # (1) macOS /bin/bash is 3.2 and build4.sh needs `declare -A` (bash 4+).
          brew install bash || true
          # (3) setup.sh requires sshtarlist.txt which the repo does not ship.
          if [ ! -f resources/sshtarlist.txt ] && [ -f resources/ssh.tar.gz ]; then
            tar -tzf resources/ssh.tar.gz > resources/sshtarlist.txt || true
            echo "derived resources/sshtarlist.txt from ssh.tar.gz"
          fi
          # setup.sh may report MISS items; the build only needs the vendored tools
          # plus pyimg4/capstone, which are checked by the next step.
          ./setup.sh || echo "::warning::setup.sh reported MISS items; continuing anyway"

      - name: Verify setup
        if: always()
        run: |
          echo "== verify =="
          echo "bash:   $(/usr/local/bin/bash --version 2>/dev/null | head -1 || echo MISSING)"
          echo "ipsw:   $(command -v ipsw >/dev/null && ipsw version 2>/dev/null | head -1 || echo MISSING)"
          echo "python3: $(python3 --version 2>&1)"

      - name: Build bootchain
        run: |
          cd builder
          # Put the brew bash (5.x) first so every script, including the ones build4.sh
          # shells out to, runs on a bash that understands `declare -A`.
          export PATH="/usr/local/bin:$PATH"
          echo "bash in use: $(bash --version | head -1)"
          # No --kpf-set: the builder auto-detects it (iOS >= 27 or TXM -> ios27,
          # iOS >= 17 -> ios18), which is what iOS 26.x needs. Hardcoding ios27 broke
          # 26.x builds.
          bash ./build4.sh --product ${{ matrix.device }} --version ${{ inputs.version }} --with-fw

      - name: iBoot version (for iboot_mapping.json)
        if: always()
        run: |
          echo "== iBoot version (para iboot_mapping.json) =="
          # The server resolves the iOS version from the SRTG (iBoot version string)
          # the client reports in DFU, so every release needs an entry in
          # iboot_mapping.json. This step surfaces that string for the build.
          for f in builder/bootchain/*/iBoot.patched.bin builder/bootchain/*/iBEC.img4; do
            [ -f "$f" ] || continue
            echo "$f:"
            strings -a "$f" 2>/dev/null | grep -oE '(iBoot|mBoot)-[0-9][0-9.]*' | sort -u | head -5 | sed 's/^/    /'
          done
          # BuildManifest, if pzb left one behind
          BM=$(find builder -name 'BuildManifest.plist' 2>/dev/null | head -1)
          if [ -n "$BM" ]; then
            echo "BuildManifest: $BM"
            /usr/libexec/PlistBuddy -c "Print :BuildIdentities:0:Info:BuildString" "$BM" 2>/dev/null | sed 's/^/    BuildString: /' || true
          else
            echo "  (no BuildManifest.plist left by pzb)"
          fi

      - name: Summary (what was produced)
        if: always()
        run: |
          echo "== bootchain =="
          find builder/bootchain -maxdepth 3 -type f 2>/dev/null | head -50 || true
          du -sh builder/bootchain 2>/dev/null || true

      - name: Disk space (after)
        if: always()
        run: df -h /

      - name: Upload artifact (bootchain)
        uses: actions/upload-artifact@v4
        with:
          name: bootchain-${{ matrix.device }}-${{ inputs.version }}
          path: builder/bootchain/
          if-no-files-found: error
          retention-days: 14
