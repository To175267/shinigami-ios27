# .github/workflows/build-ios27.yml
#
# Builds iOS 27 SSH ramdisks for the A13 Bionic generation WITHOUT a Mac,
# using a GitHub Actions macOS runner.
# Based on Rust505/iOS-ramdisk-builder-A12-A13.
#
# A13 Bionic = iPhone 11 (iPhone12,1) | 11 Pro (iPhone12,3) | 11 Pro Max (iPhone12,5) | SE2 (iPhone12,8)
# A12 (XR/XS/XS Max) has NO iOS 27 - Apple did not release it for that chip.
#
# Usage:
#   1) This file lives at  .github/workflows/build-ios27.yml  in the repo
#   2) GitHub -> "Actions" tab -> "Build iOS 27 Ramdisks" -> "Run workflow"
#   3) Pick the version (default 27.0.1) and run. Download the artifact when done.
#
# Notes:
#   - The BUILD does not need the iPhone: it downloads the IPSW and patches it.
#     The device is only used to BOOT the ramdisk (boot.sh, local, with Pwned DFU).
#   - macOS runners: free on PUBLIC repos. On private ones they consume minutes x10.
#   - tools/darwin binaries are x86_64 -> an Intel runner is required.
#     macos-13 was RETIRED on 2025-12-04: jobs requesting it stay QUEUED FOREVER
#     (no failure email). macos-15-intel is the official x86_64 replacement
#     (supported until ~Aug 2027). If that ever disappears too, switch to
#     macos-latest and add:  softwareupdate --install-rosetta --agree-to-license

name: Build iOS 27 Ramdisks

on:
  workflow_dispatch:
    inputs:
      version:
        description: "iOS version (e.g. 27.0.1)"
        required: true
        default: "27.0.1"

jobs:
  build:
    runs-on: macos-15-intel    # x86_64 (the builder binaries are Intel).
                               # macos-13 is retired -> jobs would queue forever.
    strategy:
      fail-fast: false
      matrix:
        # A13 devices with iOS 27 (remove the ones you do not want)
        device: ["iPhone12,1", "iPhone12,3", "iPhone12,5", "iPhone12,8"]
    name: build ${{ matrix.device }} iOS ${{ inputs.version }}
    steps:
      - name: Disk space (before)
        run: df -h /

      - name: Clone the builder
        run: git clone --depth 1 https://github.com/Rust505/iOS-ramdisk-builder-A12-A13.git builder

      - name: Permissions
        run: chmod +x builder/*.sh builder/scripts/*.sh

      - name: Setup (brew ipsw + pip pyimg4/capstone)
        # Two upstream quirks are worked around here:
        #  - PEP 668: the runner's python3 is "externally managed", so setup.sh's plain
        #    "pip install -r requirements.txt" would be REFUSED (it actually succeeds
        #    under PIP_BREAK_SYSTEM_PACKAGES).
        #  - the blacktop tap must be added explicitly, otherwise a non-interactive
        #    `brew install blacktop/tap/ipsw` bails out with "Would install 1 formula".
        #  - the upstream repo ships resources/ssh.tar.gz but NOT the sshtarlist.txt
        #    that setup.sh demands, so we derive it from the tarball.
        # setup.sh is allowed to report MISS items without failing the job: every tool
        # the build actually needs (pzb/gtar/img4/trustcache, pyimg4, capstone) is
        # already verified by the step below, and a hard failure here would mask it.
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          cd builder
          brew tap blacktop/tap || true
          brew install blacktop/tap/ipsw || brew install ipsw || true
          if [ ! -f resources/sshtarlist.txt ] && [ -f resources/ssh.tar.gz ]; then
            tar -tzf resources/ssh.tar.gz > resources/sshtarlist.txt || true
            echo "derived resources/sshtarlist.txt from ssh.tar.gz"
          fi
          ./setup.sh || echo "::warning::setup.sh reported MISS items; continuing anyway"

      - name: Verify setup (what is actually available)
        if: always()
        run: |
          echo "== verify =="
          echo "python: $(python3 --version 2>&1)"
          echo "brew:   $(brew --version 2>/dev/null | head -1)"
          command -v ipsw >/dev/null && echo "ipsw:   $(ipsw version 2>/dev/null | head -1)" || echo "ipsw:   MISSING"
          python3 -c "import pyimg4; print('pyimg4: OK', getattr(pyimg4,'__version__',''))" 2>&1 || echo "pyimg4: MISSING"
          python3 -c "import capstone; print('capstone: OK', capstone.__version__)" 2>&1 || echo "capstone: MISSING"

      - name: Build bootchain
        run: |
          cd builder
          ./build4.sh --product ${{ matrix.device }} --version ${{ inputs.version }} --kpf-set ios27 --with-fw

      - name: Summary (what was produced)
        if: always()
        run: |
          echo "== bootchain =="
          find builder/bootchain -maxdepth 3 -type f 2>/dev/null | head -50 || true
          du -sh builder/bootchain 2>/dev/null || true

      - name: Disk space (after)
        if: always()
        run: df -h /

      - name: Upload artifact (bootchain)
        uses: actions/upload-artifact@v4
        with:
          name: bootchain-${{ matrix.device }}-${{ inputs.version }}
          path: builder/bootchain/
          if-no-files-found: error
          retention-days: 14

